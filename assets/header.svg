<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0c0a09"/><stop offset="1" stop-color="#1c1210"/></linearGradient>
<linearGradient id="ac" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fbbf24"/><stop offset=".5" stop-color="#f97316"/><stop offset="1" stop-color="#ef4444"/><animate attributeName="x1" values="0;-1;0" dur="8s" repeatCount="indefinite"/><animate attributeName="x2" values="1;0;1" dur="8s" repeatCount="indefinite"/></linearGradient>
<radialGradient id="gl"><stop offset="0" stop-color="#f97316" stop-opacity=".35"/><stop offset="1" stop-color="#f97316" stop-opacity="0"/></radialGradient>
<style>
.t{font-family:'Segoe UI',Helvetica,Arial,sans-serif}
.p{animation:up linear infinite}@keyframes up{from{transform:translateY(0);opacity:0}20%{opacity:.9}to{transform:translateY(-200px);opacity:0}}
.cur{animation:b 1s steps(1) infinite}@keyframes b{50%{opacity:0}}
.in{opacity:0;animation:in .9s ease-out forwards}@keyframes in{from{opacity:0;transform:translateX(-24px)}to{opacity:1;transform:none}}
.d1{animation-delay:.2s}.d2{animation-delay:.6s}.d3{animation-delay:1s}.d4{animation-delay:1.4s}
.glow{animation:gl 5s ease-in-out infinite alternate}@keyframes gl{to{transform:translate(-60px,20px) scale(1.2)}}
</style></defs>
